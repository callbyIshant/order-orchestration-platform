spring:
  application:
    name: catalog-service
  datasource:
    url: ${CATALOG_JDBC_URL:jdbc:postgresql://127.0.0.1:${POSTGRES_PORT:5432}/catalog_db}
    username: ${CATALOG_DB_USER:catalog_user}
    password: ${CATALOG_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8081}

fulfillx:
  oidc:
    provider: ${FULFILLX_OIDC_PROVIDER:cognito}
    issuer-uri: ${FULFILLX_OIDC_ISSUER_URI:}
    jwk-set-uri: ${FULFILLX_OIDC_JWK_SET_URI:}
    audience: ${FULFILLX_OIDC_AUDIENCE:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    group:
      liveness:
        include: livenessState
      readiness:
        include: readinessState,db
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://127.0.0.1:4318/v1/traces}
      export:
        enabled: ${OTEL_TRACES_ENABLED:true}

logging:
  structured:
    ecs:
      service:
        name: ${spring.application.name}
    format:
      console: ecs




