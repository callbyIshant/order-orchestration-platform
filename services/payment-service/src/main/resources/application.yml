spring:
  application:
    name: payment-service
  datasource:
    url: ${PAYMENT_JDBC_URL:jdbc:postgresql://127.0.0.1:${POSTGRES_PORT:5432}/payment_db}
    username: ${PAYMENT_DB_USER:payment_user}
    password: ${PAYMENT_DB_PASSWORD}
  flyway:
    enabled: true
  task:
    scheduling:
      pool:
        size: 2
aws:
  region: ${AWS_REGION:us-east-1}
  endpoint-url: ${AWS_ENDPOINT_URL:}
  access-key-id: ${AWS_ACCESS_KEY_ID:}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
payment:
  messaging:
    consumer-enabled: ${PAYMENT_CONSUMER_ENABLED:true}
    queue-name: ${PAYMENT_COMMANDS_QUEUE:fulfillx-payment-commands}
    dlq-name: ${PAYMENT_COMMANDS_DLQ:fulfillx-payment-commands-dlq}
    topic-arn: ${FULFILLX_DOMAIN_EVENTS_TOPIC_ARN:}
  poll-ms: ${PAYMENT_CONSUMER_POLL_MS:1000}
  visibility-base-seconds: ${PAYMENT_VISIBILITY_BASE_SECONDS:2}
  visibility-max-seconds: ${PAYMENT_VISIBILITY_MAX_SECONDS:30}
  outbox:
    publisher-enabled: ${PAYMENT_OUTBOX_PUBLISHER_ENABLED:true}
    poll-ms: ${PAYMENT_OUTBOX_POLL_MS:1000}
    batch-size: ${PAYMENT_OUTBOX_BATCH_SIZE:20}
    lease-seconds: ${PAYMENT_OUTBOX_LEASE_SECONDS:30}
    retry-seconds: ${PAYMENT_OUTBOX_RETRY_SECONDS:2}
server:
  port: ${SERVER_PORT:8084}

fulfillx:
  oidc:
    provider: ${FULFILLX_OIDC_PROVIDER:cognito}
    issuer-uri: ${FULFILLX_OIDC_ISSUER_URI:}
    jwk-set-uri: ${FULFILLX_OIDC_JWK_SET_URI:}
    audience: ${FULFILLX_OIDC_AUDIENCE:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    group:
      liveness:
        include: livenessState
      readiness:
        include: readinessState,db
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://127.0.0.1:4318/v1/traces}
      export:
        enabled: ${OTEL_TRACES_ENABLED:true}

logging:
  structured:
    ecs:
      service:
        name: ${spring.application.name}
    format:
      console: ecs


